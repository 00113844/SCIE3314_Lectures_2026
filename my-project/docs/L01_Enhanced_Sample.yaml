  # EXAMPLE 4: Case study slide with real WA scenario
  # ══════════════════════════════════════════════════════════════════════════
  
  - title: "The Stubble Dilemma: Trade-offs in Action"
    
    description: >
      A case study examining stubble management decisions at a real WA farm,
      demonstrating the cascading consequences across the system.
    
    key_concepts:
      - name: "Trade-off thinking"
        terms: ["trade-off", "no free lunch", "cascading effects", "system consequences"]
        cognitive_level: "evaluate"
    
    wiki_references:
      - slug: "stubble_management_western_australia"
        relevance: "foundation"
        
      - slug: "no_till_farming_systems_in_western_australia"
        relevance: "context"
        sections: ["Stubble Retention Benefits", "Challenges"]
    
    learning_outcomes:
      - "Demonstrate critical thinking at a farming systems scale"
      - "Recognise the benefits and disadvantages of tillage and stubble management"
    
    estimated_time_minutes: 10
    slide_type: "case_study"
    interactivity: "high"
    
    teaching_notes: >
      SCENARIO: "You manage 5000 ha near Geraldton (350mm rainfall zone).
      Last year: 4.2 t/ha wheat harvest = heavy stubble (5 t/ha residue).
      This year: Planning to sow canola in late April.
      
      Your agronomist says: 'Burn half your stubble before seeding.'
      Your neighbor (no-till purist) says: 'Never burn! You're wasting organic matter.'
      Your bank manager says: 'Just make a profit.'
      
      What do you decide? Why?"
      
      THINK: 3 min solo—students write down decision + 3 reasons
      PAIR: 4 min—compare with partner, must agree on ONE decision
      SHARE: 5 min—poll class, discuss divergence
      
      REVEAL TRADE-OFFS:
      - Retain stubble → moisture conservation, OM buildup, erosion control
                       → BUT: N tie-up, disease carryover, seeding difficulty, slug habitat
      - Burn stubble → clean seedbed, disease break, release N
                     → BUT: OM loss, erosion risk, smoke pollution, lost moisture
      - Strategic burn (windrows only, or 50%) → middle path
      
      NO RIGHT ANSWER—depends on:
        • Subsoil moisture going into season
        • Disease pressure last year (blackleg in canola?)
        • Seeding machinery type (disc vs tine)
        • Labor/time to manage heavy stubble
        • Local fire regulations
        • Long-term soil health vs short-term profit
      
      KEY LESSON: "Systems thinking means accepting trade-offs, not optimizing one variable."
    
    discussion_prompts:
      - "What evidence would change your decision?"
      - "Which trade-off matters most in a dry season vs wet season?"
      - "How would you experiment to learn your farm's optimal strategy?"
    
    common_misconceptions:
      - "Believing there's a 'correct' answer (there isn't—context dependent)"
      - "Ignoring the multi-year dimension (one season's decision affects next)"
      - "Forgetting the human dimension (workload, stress, values)"
    
    synthesis_mode: "hybrid"  # Combine wiki facts with case study narrative
    max_wiki_sources: 3


