topic: "Global Food Markets and Food Security"
auto_figures: true
subtopics:

  - title: "The Grand Challenge: Feeding a Growing World"
    description: >
      Open the unit's final lecture by zooming out from the WA paddock to the global challenge that gives all of agriculture its ultimate purpose: producing enough nutritious food, sustainably, for a world population heading toward roughly ten billion people by mid-century, with rising incomes driving greater demand for grain, meat, and oilseeds. Frame the scale of the task: global food demand is projected to rise substantially over coming decades, driven by population growth and by dietary change as developing economies grow and consume more animal protein (which multiplies grain demand through feed) and more vegetable oil. Establish the central tension the lecture explores: this rising demand must be met even as the resource base is constrained — limited new arable land, competition for water, soil degradation, and a changing climate that threatens production in many regions — so the world must produce much more food from essentially the same or a shrinking resource base, largely by raising productivity (yield per hectare and per unit of water and input) sustainably. Position WA and Australian grain production within this: a small but efficient, export-oriented producer whose surplus feeds food-importing nations, and whose continual productivity improvement (the theme of the whole unit) is part of the global response to the food-security challenge.
    key_concepts:
      - "World population heading toward ~10 billion by mid-century"
      - "Rising incomes multiply grain demand via animal protein"
      - "Resource base is constrained: land, water, soil, climate"
      - "Productivity growth, not new land, must meet the gap"
    wiki_query: "global food demand population growth productivity yield"

  - title: "How the World Is Fed: Production and the Staple Crops"
    description: >
      Give students a picture of how the world's food is actually produced and which crops matter most, providing the factual foundation for the market discussion. Explain that a small number of staple crops supply the majority of human calories: the cereals — wheat, rice, and maize above all — dominate direct human food and animal feed, with wheat the most important internationally traded food grain, rice the staple of Asia (but largely consumed where it is grown), and maize the great feed and industrial crop. Oilseeds (soybean, oil palm, canola/rapeseed, sunflower) supply vegetable oil and protein meal, with soybean central to the global feed-protein trade. Explain the geography of production: food is produced across very different systems, from intensive, high-input, high-yield agriculture in developed regions to smallholder, lower-input systems that feed much of the developing world, and from irrigated to rainfed. Explain the key distinction between production and trade: most food is consumed in the country where it is grown, and only a fraction of global grain production is traded internationally — but that traded fraction is what feeds the food-importing nations and is what WA participates in. Emphasise where WA fits: a specialist producer of wheat, barley, canola, and pulses for the international trade, particularly serving the food-deficit and rising-demand markets of Asia, the Middle East, and North Africa across the Indian Ocean.
    key_concepts:
      - "Wheat, rice and maize dominate global caloric supply"
      - "Soybean anchors global protein-meal and oil trade"
      - "Most food is consumed where it is grown; only a fraction trades"
      - "WA specialises in the internationally traded fraction"
    wiki_query: "global staple crop production wheat rice maize trade"

  - title: "The Structure of World Grain Trade"
    description: >
      Explain how the world grain trade is structured — who exports, who imports, and why — since this structure determines the markets and prices WA growers face. Describe the exporters: a relatively small group of major grain-exporting regions with large surpluses supplies the world's traded grain — for wheat, the major exporters include Russia and the Black Sea region (now the largest), the European Union, the United States, Canada, Argentina, Ukraine, and Australia; for coarse grains and oilseeds the cast differs. Describe the importers: food-deficit regions that cannot produce enough for their own needs — much of the Middle East, North and sub-Saharan Africa, and parts of Asia — depend on imported grain for food security, making them the customers for exporters like WA. Explain Australia's and WA's particular position: a consistent, quality-focused exporter well placed geographically to supply the growing Asian and Indian Ocean markets, acting as an important "swing" supplier whose exportable surplus, though modest globally, matters to its customers and to world balance. Explain the strategic significance of trade concentration: because so much of world grain export comes from a few regions, a production shock in a major exporter (drought, war, export restriction) can sharply move world prices and threaten importing nations' food security — the vulnerability that makes reliable exporters valuable and that drives the price volatility explored next.
    figure_id: "Fig-L14-GrainTrade"
    image_prompt: >
      World map showing the major grain exporting regions (Black Sea/Russia, EU, North America, Argentina, Australia) as sources with outgoing arrows, and the major importing regions (Middle East, North and sub-Saharan Africa, parts of Asia) as destinations with incoming arrows. Australia/WA's export arrows directed toward Asia and the Indian Ocean rim highlighted. UWA blue (#27348B) exporters, gold (#E2B600) trade-flow arrows, clean academic map, --ar 16:9, --no text.
    key_concepts:
      - "Few major exporters supply most of the traded surplus"
      - "Food-deficit importers depend on that surplus for security"
      - "Australia/WA: a consistent, quality-focused swing supplier"
      - "Export concentration means shocks move world prices sharply"
    wiki_query: "world grain export import structure trade concentration"
