topic: "Nematodes and Soilborne Diseases of Crops"
auto_figures: true
subtopics:

  - title: "The Hidden Enemy: What Are Plant Parasitic Nematodes?"
    description: >
      Open by introducing plant parasitic nematodes as microscopic roundworms that live in the soil and feed on plant roots, causing large but often unrecognised yield losses across the WA grainbelt. Emphasise why they are the "hidden enemy": they are invisible to the naked eye, their damage occurs underground on the roots, and their above-ground symptoms — patchy poor growth, stunting, yellowing, and reduced vigour — are non-specific and easily mistaken for nutrient deficiency, waterlogging, or drought, so their impact is chronically underestimated, despite an estimated 60% of WA cropping paddocks carrying at least one species of root lesion nematode. Describe the general biology: nematodes possess a needle-like mouthpart (a stylet) that they use to pierce root cells and withdraw their contents, damaging roots directly and, critically, impairing the root system's ability to take up water and nutrients — a serious consequence in the water-limited Mediterranean environment, where a compromised root system cannot access the subsoil moisture the crop depends on during the terminal drought. Establish the lecture's plan: to examine the main plant parasitic nematodes of WA, their lifecycles, how they are diagnosed, and how they are managed, and then to broaden to the soilborne fungal diseases (especially Rhizoctonia) that share the same cryptic, root-attacking, difficult-to-manage character, along with the principles of disease management.
    key_concepts:
      - "Underground damage, non-specific above-ground symptoms"
      - "Stylet feeding impairs water and nutrient uptake"
      - "Roughly 60% of WA paddocks carry root lesion nematode"
      - "Compromised roots are acutely costly in a water-limited system"
    wiki_query: "plant parasitic nematode WA prevalence root lesion stylet damage"

  - title: "The Main Plant Parasitic Nematodes of WA"
    description: >
      Introduce the principal plant parasitic nematodes affecting WA broadacre crops, and their differing habits, before the following slides examine two of the most important in detail. Root lesion nematodes (Pratylenchus, particularly P. neglectus and P. thornei / P. quinisulcatus) are the most widespread and economically important nematodes in WA cereals: they are migratory endoparasites that move freely through root tissue throughout their life, feeding as they go and killing cells to create lesions, and they carry wide host ranges spanning cereals and many broadleaf crops and weeds, which makes them notably difficult to starve out through rotation alone — a sharp contrast with the more host-specific cyst and root-knot nematodes covered next. Cereal cyst nematode (Heterodera avenae) and root knot nematode (Meloidogyne species) are both sedentary endoparasites, establishing a single, permanent feeding site rather than moving through the root, but with very different consequences for the plant and very different management implications, developed in their own slides. Emphasise the key management-relevant contrasts across all three groups: host range (wide-host lesion nematodes are far harder to manage by rotation than the more host-specific cyst and root-knot species), feeding habit (migratory versus sedentary), and persistence (cyst-forming species survive long in soil, protected inside the hardened cyst). Explain that knowing which nematode is present is essential, because management — particularly the choice of resistant crops and rotations — depends entirely on the species and its host range, making accurate diagnosis the foundation of control.
    figure_id: "Fig-L12-NematodeTypes"
    image_prompt: >
      Comparison diagram of the main plant parasitic nematode groups affecting WA crops. Panel 1 "Root lesion (Pratylenchus)": a migratory nematode moving through root tissue leaving brown lesions. Panel 2 "Cereal cyst (Heterodera)": a swollen female forming a cyst on the root. Panel 3 "Root knot (Meloidogyne)": galls/knots on roots. Each labelled with feeding habit (migratory vs sedentary) and host range. UWA blue (#27348B) roots, gold (#E2B600) nematodes and labels, academic diagram, --ar 16:9, --no text.
    key_concepts:
      - "Root lesion nematodes: migratory, wide host range, hard to rotate away"
      - "Cyst and root-knot nematodes: sedentary, single feeding site"
      - "Host range and persistence drive which nematodes are manageable"
    wiki_query: "root lesion nematode Pratylenchus wide host range WA cereal"
    figure_source: "manual"

  - title: "The Nematode Lifecycle"
    description: >
      Explain the general lifecycle of plant parasitic nematodes, since understanding it is the key to their management. Describe the stages common to the group: eggs hatch to release juveniles, which pass through several moults to become adults; the juveniles and adults feed on roots, and the females produce the next generation of eggs, completing the cycle. Explain the lifecycle features that matter for management. Reliance on a living host: nematodes need host roots to feed and reproduce, so their populations build up under susceptible crops and decline when a non-host or resistant crop starves them — the biological basis for rotational control. Survival between hosts: nematodes persist through the summer and non-host periods as eggs (and, for cyst nematodes, within the protective cyst), so populations carry over between seasons and cannot simply be eliminated in one break. Multiple generations and rapid multiplication under a good host: populations can build quickly when a susceptible crop is grown repeatedly. Explain how the lifecycle differs between the migratory lesion nematodes (which move freely and feed within roots throughout, with wide host ranges) and the sedentary cyst and root-knot nematodes (which establish a fixed feeding site and whose females become immobile, with the cyst providing long-term egg survival). Emphasise the management logic that flows from the lifecycle: because nematodes depend on host roots and survive as resistant eggs, control centres on manipulating the host sequence to starve them and choosing resistant crops that prevent them multiplying — developed in the management slide.
    key_concepts:
      - "Populations build on hosts, decline on non-hosts"
      - "Eggs (and cysts) survive between-host periods"
      - "Migratory vs sedentary lifecycles differ in mobility"
    wiki_query: "nematode lifecycle egg juvenile host survival WA"

  - title: "Cereal Cyst Nematode (CCN): Biology and Reproduction"
    description: >
      Take the first of the two sedentary nematodes just introduced and examine its biology in detail, since CCN (Heterodera avenae) is historically one of the most damaging cyst nematodes in WA cereals. Explain that infective second-stage juveniles (J2) hatch in response to cool, moist conditions and root exudates, then move through the soil to penetrate the root tips of susceptible hosts. Once inside, the nematode establishes a single fixed feeding site (a syncytium) and stops moving. Describe the reproductive phase: the female feeds and swells dramatically, eventually rupturing the root cortex to become visible on the outside of the root as a small, white, lemon-shaped body; upon dying, her cuticle hardens into a tough, brown cyst that protects hundreds of dormant eggs inside. Emphasise the crucial biological trait for management: CCN is highly host-specific, reproducing primarily on cereals (wheat, barley, oats) and grassy weeds, and the protective cyst allows its eggs to survive in the soil for several years even through harsh, dry WA summers — the biological basis for the rotation-based control developed shortly.
    figure_id: "Fig-CCN-Lifecycle"
    image_prompt: >
      A biological lifecycle diagram of the Cereal Cyst Nematode (Heterodera avenae). Showing the cycle from a dormant brown cyst in the soil, to juvenile nematodes hatching and penetrating a cereal root, to the swollen white female nematode attached to the outside of the root, and finally hardening back into a brown cyst. Academic style, clear scientific arrows, UWA blue (#27348B) and gold (#E2B600) color scheme, --ar 16:9, --no text.
    key_concepts:
      - "Heterodera avenae lifecycle and syncytium feeding site"
      - "Cyst formation protects eggs through dry summers"
      - "Narrow host range: cereals and grassy weeds"
    wiki_query: "cereal cyst nematode heterodera avenae lifecycle host range WA"
    figure_source: "manual"

  - title: "Root-Knot Nematode (RKN): Biology and Gall Formation"
    description: >
      Contrast CCN with the second sedentary nematode, root-knot nematode (Meloidogyne species, such as M. incognita or M. javanica), whose biological interaction with the root is quite different despite a similar starting point. As with CCN, infective J2 juveniles penetrate the root tip, but instead of a syncytium, the nematode induces surrounding root cells to enlarge and divide rapidly into giant cells that serve as its feeding site, causing the root tissue around them to swell into characteristic fleshy galls, or knots. The female remains entirely enclosed within the gall, swelling into a pear shape and laying hundreds of eggs in a gelatinous matrix on or just below the root surface. Emphasise the critical contrast with CCN that drives everything about its management: RKN forms no protective cyst, but it carries an exceptionally wide host range, infecting broadleaf crops such as canola, lupins, and chickpeas, many weeds, and even some cereals — making it far more adaptable, and far harder to starve out through rotation, than the host-specific CCN.
    key_concepts:
      - "Meloidogyne induces giant cells, causing root galls (knots)"
      - "No protective cyst, unlike CCN"
      - "Very wide host range across broadleaf crops, weeds, some cereals"
    wiki_query: "root knot nematode Meloidogyne gall formation wide host range"

  - title: "Diagnosis: Knowing What You Have"
    description: >
      Explain how nematode problems are diagnosed, a crucial step because the symptoms are non-specific and management depends on identifying the species and its population level. Describe the diagnostic pathway. Recognising the field signs: patchy, non-specific poor growth, stunting, yellowing, and wilting under mild heat stress, and poor root systems, often in patches, that do not respond to nutrition — a prompt to investigate rather than a diagnosis in itself. Examining roots, where the below-ground signs differentiate the groups just covered: lesions on migratory lesion nematode damage; for CCN, roots that are shortened, thickened, and highly branched — "knotty" but not galled — with tiny white, pinhead-sized female cysts visible on the root surface in spring; and for RKN, distinct fleshy swellings or galls integral to the root structure itself, quite different in character from a cyst. Laboratory testing provides the definitive answer: extracting and counting nematodes from soil and root samples, and, increasingly, DNA-based soil tests such as the PREDICTA B service, which quantify the DNA of specific nematode species and soilborne pathogens in a soil sample before sowing, identifying both species and population density and allowing growers to know the risk in each paddock ahead of the season. Explain the value of pre-season DNA testing: it turns an invisible, easily-misdiagnosed underground problem into a measured risk that can be managed proactively through crop and variety choice, shifting management from reactive to proactive. Emphasise the recurring theme of measurement and ground-truthing: because nematode damage is cryptic and its management is species-specific, accurate diagnosis is the indispensable first step, and modern DNA testing has transformed the ability to manage these hidden pests.
    figure_id: "Fig-Diagnosis-Roots"
    image_prompt: >
      A side-by-side comparison diagram of cereal roots. The left panel shows roots infected with cereal cyst nematode, featuring highly branched, shortened roots with tiny white pinhead-sized cysts attached to the exterior. The right panel shows roots infected with root-knot nematode, featuring large, fleshy, swollen galls integrated directly into the root structure. Academic biological illustration, UWA blue (#27348B) background elements, --ar 16:9, --no text.
    key_concepts:
      - "Field signs are non-specific; roots must be examined directly"
      - "Cysts (CCN) vs galls (RKN) vs lesions (lesion nematode)"
      - "PREDICTA B: pre-season DNA testing for species and density"
      - "Shifts management from reactive to proactive"
    wiki_query: "nematode diagnosis cyst gall lesion PREDICTA B soil DNA testing"
    figure_source: "manual"

  - title: "Managing Nematodes"
    description: >
      Set out the integrated management of plant parasitic nematodes, which — like weed and disease management — relies on combining tactics that exploit the pest's biology, since chemical options are limited in broadacre cropping. Resistant and non-host crops and varieties: the cornerstone of management — growing crops and varieties that the nematode cannot reproduce on (resistance) starves the population down, and this depends entirely on knowing the species, because a crop that is a non-host to one nematode may be a good host to another. Distinguish resistance, formally defined as a nematode multiplication rate below 1 (the population declines under that crop), from tolerance, the crop's ability to maintain growth and yield despite carrying a high nematode population — the ideal is a variety that is both, and cultivar choice can differ sharply: Yitpi wheat is both resistant and tolerant to cereal cyst nematode, while Jans wheat is susceptible and intolerant, illustrating how much variety selection alone can matter. Rotation: sequencing resistant and non-host crops to run the population down — WA trial data show this can be dramatic, with resistant-crop rotations reducing root lesion nematode levels from around 11 nematodes per gram of soil to under 1 — straightforward for host-specific nematodes like cereal cyst nematode but difficult for wide-host lesion nematodes that few crops starve. Managing other hosts: controlling weeds and volunteers that host the nematode over the summer and in break phases, since these sustain the population. Maintaining good crop vigour and nutrition: helping the crop tolerate damage, though this does not reduce the population. Note the very limited role of nematicides in broadacre grain (uneconomic and largely unavailable at field scale), which throws the emphasis onto the biological and rotational tactics. Emphasise the difficulties the learning outcomes stress: the cryptic nature of the damage, the species-specificity of resistance, the intractability of wide-host nematodes, and the need for accurate diagnosis and long-term, rotation-based planning — a genuinely challenging management problem.
    key_concepts:
      - "Resistance (multiplication rate <1) vs tolerance (yields despite nematodes)"
      - "Variety choice matters: Yitpi resistant/tolerant, Jans susceptible"
      - "WA rotation trials cut nematode levels roughly tenfold"
      - "Nematicides largely uneconomic in broadacre grain"
    wiki_query: "nematode resistance tolerance multiplication rate variety rotation trial WA"

  - title: "Agronomic Management of CCN: Exploiting Host Specificity"
    description: >
      Apply the general management principles just set out to CCN as a worked example, since its narrow host range makes it the more tractable of the two sedentary nematodes. Because CCN relies on cereals and grasses to reproduce, crop rotation is genuinely effective: a one- or two-year break with non-host broadleaf crops such as canola, lupins, or field peas will rapidly decline the population in the soil. Where a cereal must be grown, resistant varieties bred for CCN prevent the nematode completing its lifecycle, drastically reducing the number of cysts formed. Emphasise that strict weed control during the break is non-negotiable: grassy weeds like annual ryegrass and wild oats are alternative hosts, and if they are not controlled during the break-crop phase, the nematode population is sustained regardless of what crop is nominally grown, rendering the rotation useless in practice.
    key_concepts:
      - "Non-host broadleaf break crops rapidly decline CCN populations"
      - "Resistant cereal varieties limit cyst formation"
      - "Grassy weeds as alternative hosts can undo the rotation"
    wiki_query: "cereal cyst nematode rotation resistant variety weed host WA"

  - title: "Agronomic Management of RKN: Navigating a Wide Host Range"
    description: >
      Contrast this with RKN, significantly harder to manage agronomically precisely because of the wide host range just described. Simply switching from a cereal to a broadleaf crop is often ineffective, since many Meloidogyne species thrive on broadleaf crops such as pulses and canola too, so rotation only works with highly strategic planning: identifying the specific Meloidogyne species present through DNA testing, then selecting the particular non-host crops or resistant varieties known to work against that species. Highlight the importance of summer weed management — controlling the green bridge — since summer weeds can host RKN and let its population multiply before the winter crop is even sown. Note the supporting role of early sowing and strong nutrition, helping the crop build a robust root system and tolerate RKN feeding before soil temperatures reach the range that favours peak nematode activity. Emphasise the general lesson this comparison teaches: management difficulty tracks host-range breadth directly, which is exactly why accurate species-level diagnosis, not just "nematodes present," determines what a grower can actually do about it.
    key_concepts:
      - "Wide host range undermines simple cereal-to-broadleaf rotation"
      - "Species-level DNA testing needed to select non-hosts/resistant varieties"
      - "Green bridge (summer weeds) sustains RKN between crops"
    wiki_query: "root knot nematode management rotation green bridge species identification"

  - title: "Suppressive Soils and the Soil Biology"
    description: >
      Introduce the concept of disease- and nematode-suppressive soils, an area of growing interest that links nematode and disease management to soil biology. Define a suppressive soil as one in which a pest or pathogen fails to establish or cause damage despite the presence of the pest, a susceptible host, and favourable conditions — because the soil's biological community (beneficial microbes, predators, and antagonists) suppresses it. Explain the mechanisms: a diverse and active soil microbial and faunal community can compete with, parasitise, or prey upon nematodes and pathogens, keeping their populations and damage below threshold. Explain how suppression is thought to be encouraged: practices that build soil organic matter and biological activity and diversity — stubble retention, reduced tillage, diverse rotations, and organic inputs — the same conservation-agriculture practices promoted throughout the unit, which can foster the biology that suppresses soilborne pests over time. Discuss the important qualifications: suppression is complex, variable, slow to develop, not fully understood or reliably manipulable, and does not replace the other management tactics — but it represents a promising, sustainability-aligned dimension of soilborne pest and disease management. Emphasise the connection to the wider unit: the same soil biology that cycles nutrients and builds structure also influences pest and disease pressure, reinforcing that a healthy, biologically active soil is central to a productive, resilient, and more self-regulating cropping system.
    key_concepts:
      - "Suppressive soil: pest fails despite host and conditions present"
      - "Diverse soil biology competes with, preys on, or parasitises pests"
      - "Built via organic matter, reduced tillage, diverse rotation"
      - "Promising but slow, variable, and not a standalone solution"
    wiki_query: "suppressive soil biology microbial nematode disease WA"

  - title: "Rhizoctonia: Symptoms and Field Signs"
    description: >
      Introduce Rhizoctonia (Rhizoctonia solani, causing rhizoctonia bare patch and root rot) as one of the most important and difficult soilborne fungal diseases of WA cereals, sharing the cryptic, root-attacking character of nematodes and capable of cutting yield by up to around 50% in severe patches. Describe the distinctive field and plant symptoms so students can recognise them. Field symptoms: characteristic sharply-defined bare patches or areas of stunted, uneven crop, often roughly circular, appearing early in the season, where affected plants are severely set back — a pattern quite distinct from nutrient or moisture patterns. Plant and root symptoms: the fungus attacks the roots, producing characteristic "spear-tipped", pinched, brown-rotted root tips where the fungus has severed and killed the growing root, so affected plants have pruned, stubby root systems that cannot take up water and nutrients, causing the stunting seen above ground. Note that host tolerance varies considerably even among cereals — oats are the most tolerant cereal to Rhizoctonia and barley the least — a useful, low-cost lever in rotation and paddock planning. Emphasise the recognition skill: the combination of early-season bare or stunted patches with the distinctive spear-tipped, brown root pruning is diagnostic of Rhizoctonia, and distinguishing it from nematode damage, nutrient deficiency, and other root diseases (which can co-occur) is an important field diagnostic exercise — one where the pre-season DNA soil tests that quantify Rhizoctonia inoculum are, as for nematodes, increasingly valuable.
    figure_id: "Fig-L12-Rhizoctonia"
    image_prompt: >
      Two-panel diagram. Left "Field symptom": an aerial/paddock view showing sharply defined circular bare patches of stunted crop within an otherwise even cereal crop. Right "Root symptom": a close-up of cereal roots with characteristic spear-tipped, pinched, brown-rotted root tips (Rhizoctonia pruning), beside a healthy root for comparison. UWA blue (#27348B), gold (#E2B600) diseased tissue and labels, academic diagram, --ar 16:9, --no text.
    key_concepts:
      - "Sharply defined circular bare patches, early season"
      - "Spear-tipped, pinched, brown-rotted root tips"
      - "Can cut yield by up to ~50% in affected patches"
      - "Oats most tolerant cereal, barley least tolerant"
    wiki_query: "Rhizoctonia bare patch symptoms cereal tolerance WA"
    figure_source: "manual"

  - title: "The Rhizoctonia Pathogen Cycle and Pathogenic Variability"
    description: >
      Explain the biology and pathogen cycle of Rhizoctonia, and introduce the important concept of pathogenic variability. Describe the pathogen: Rhizoctonia solani is a soil-inhabiting fungus that survives in soil and on organic matter as hyphae and resting structures, without needing a living host between crops, and grows through the soil to attack roots when a susceptible crop is present, favoured particularly by cool conditions and by undisturbed soil that lets its hyphal network remain intact. Explain the pathogen cycle: the fungus persists in the soil, colonises crop residues and roots, attacks the new crop's roots early in the season causing the bare patches, and builds inoculum for subsequent crops. Introduce pathogenic variability — the crucial idea that Rhizoctonia solani is not a single uniform organism but comprises different strains and groups (anastomosis groups, AGs) that differ in the crops they attack and their aggressiveness — so the population affecting cereals may differ from that affecting other crops, and this variability complicates the search for resistance and the design of rotations. Ground this with the two AGs of most WA relevance: AG8 is the dominant, most pathogenic strain across the cereal-growing wheatbelt generally, while AG11 is a specialised strain that specifically targets lupin hypocotyls and is a particular problem in some districts, such as around Geraldton — a concrete illustration that "Rhizoctonia" is really a family of locally-relevant, crop-specific threats rather than one enemy. Emphasise the general principle, recurring across the pathology content of the unit: pathogens are variable populations that evolve and differ in host range and virulence (as seen with blackleg resistance groups in canola and herbicide resistance in weeds), so management must account for and monitor this variability rather than assuming a fixed enemy.
    key_concepts:
      - "Anastomosis groups (AGs): Rhizoctonia is a family of strains"
      - "AG8: dominant, most pathogenic strain in WA cereals"
      - "AG11: specialised strain targeting lupin hypocotyls"
      - "Variability complicates resistance breeding and rotation design"
    wiki_query: "Rhizoctonia solani anastomosis group AG8 AG11 lupin WA"

  - title: "Managing Rhizoctonia: The Difficulty of Control"
    description: >
      Examine the management of Rhizoctonia and, importantly, why it is so difficult — a candid treatment of the challenges the learning outcomes emphasise. Explain the constraints: the fungus has a wide host range and survives freely in soil without a host, so rotation alone cannot starve it out the way it can a host-specific pathogen; genetic resistance in cereals is limited, so there are few resistant varieties to deploy; and its damage occurs very early, before the crop can be treated in-season. Set out the management tactics that are used, in combination. Cultural and physical: strategic soil disturbance below the seed (tillage or specialised seeding openers that disturb the soil in the root zone) can break up the fungal hyphal network and reduce damage — an interesting exception to the no-till default, illustrating strategic tillage; and ensuring vigorous early crop growth (good nutrition, including adequate nitrogen and trace elements, and reducing other root stresses) helps the crop outgrow the disease. Nutrition: banded nutrients near the seed to promote rapid early root growth past the attack zone. Managing the green bridge and rotation: controlling weeds and volunteers that maintain the fungus, and using less-susceptible crops in the sequence where possible. Fungicides and seed treatments: some seed and in-furrow fungicide options provide partial suppression but are not a complete solution. Emphasise the honest conclusion: Rhizoctonia is a genuinely difficult disease with no single effective control, managed by stacking partial tactics — resistance is weak, rotation is undermined by the wide host range and soil survival, and the early timing of damage limits intervention — making it a clear illustration of why integrated, biology-based, expectation-managed disease management is necessary.
    key_concepts:
      - "Wide host range and soil survival defeat rotation alone"
      - "Genetic resistance limited; damage occurs too early to treat"
      - "Strategic soil disturbance breaks up the hyphal network"
      - "Vigorous early growth (nutrition) helps the crop outgrow attack"
    wiki_query: "Rhizoctonia management tillage nutrition resistance limitations WA"

  - title: "Fungicides: Modes of Action and Their Limitations"
    description: >
      Broaden to the principles of fungicide use, since fungicides are a key tool against many crop diseases (though limited against soilborne ones like Rhizoctonia). Explain that fungicides, like herbicides, work by disrupting specific biochemical processes in the target fungus, and are grouped by mode of action accordingly. Distinguish the broad functional categories: protectant (contact) fungicides that must be present on the plant surface before infection to prevent the fungus establishing, and systemic fungicides that are taken up and moved within the plant and can act after infection has begun, giving some curative activity. Explain the different modes of action — groups that inhibit different fungal processes (such as sterol biosynthesis, respiration, and others) — and the critical management implication that exactly parallels herbicides: fungi evolve resistance to fungicides, and fungicides sharing a mode of action are subject to cross-resistance, so modes of action must be rotated and mixed to preserve their effectiveness. Explain the limitations of relying on fungicides: they are most effective against foliar diseases where timing to protect key leaves is possible, far less so against soilborne root diseases; they add cost that must be justified by disease risk; their timing relative to infection and crop stage is critical; and over-reliance on a narrow set of modes of action drives resistance in the pathogen. Emphasise that fungicides are one tool within integrated disease management — most powerful when combined with resistant varieties, rotation, clean seed, and hygiene — not a standalone solution, and that stewardship of fungicide modes of action is a shared responsibility, just as for herbicides.
    key_concepts:
      - "Protectant (contact) vs systemic fungicides"
      - "Mode-of-action grouping and cross-resistance, as with herbicides"
      - "Far more effective on foliar disease than soilborne root disease"
      - "One tool within integrated disease management, not a standalone fix"
    wiki_query: "fungicide mode of action protectant systemic resistance rotation"

  - title: "Integrated Management of Soilborne Pests and Diseases"
    description: >
      Conclude by drawing the nematode and soilborne-disease material together into a unified framework for managing the hidden, root-attacking threats to WA crops, and connecting it to the whole unit. Emphasise the common character of these problems: they are cryptic (damage is underground and symptoms non-specific), they persist in the soil between crops, they are variable populations that differ in host range and virulence, chemical control is limited or absent, and their management depends on accurate diagnosis and long-term, biology-based, integrated strategies rather than a single fix. Consolidate the shared management principles: diagnose accurately (increasingly using pre-season DNA soil tests that quantify multiple nematodes and pathogens at once); choose resistant crops and varieties matched to the specific pest present; rotate to starve host-specific pests (recognising this fails for wide-host organisms); control the green bridge of weeds and volunteers; maintain crop vigour and healthy roots to tolerate damage; build biologically active, potentially suppressive soils through conservation agriculture; and use fungicides and seed treatments judiciously with mode-of-action rotation where they help. Add the one management dimension not yet covered: farm hygiene. Because nematodes themselves move only slowly through soil, their main route of spread between paddocks and between farms is passive — contaminated soil carried on seeding and harvesting equipment, vehicles, and even livestock — so thoroughly cleaning down machinery between paddocks, especially when moving from a known infested paddock, is a simple, cheap, and often-overlooked preventative practice that belongs alongside rotation and resistance as core nematode management. Emphasise the connections across the unit: the same integrated, resistance-aware, biology-based philosophy governs weed, disease, and nematode management alike; the same soil biology and conservation practices underpin nutrient cycling, structure, and pest suppression; and the same discipline of accurate measurement and diagnosis underpins good management of every hidden constraint. Reinforce the professional message: because these root-zone threats are invisible and easily underestimated, the skilled agronomist actively investigates, diagnoses, and manages them within a long-term systems plan rather than waiting for the unmistakable damage that means the yield is already lost.
    key_concepts:
      - "Shared principles: diagnose, resist, rotate, manage green bridge"
      - "Farm hygiene: clean machinery to stop passive soil-borne spread"
      - "Same integrated, biology-based philosophy as weed and disease management"
    wiki_query: "integrated nematode disease management farm hygiene machinery WA"

