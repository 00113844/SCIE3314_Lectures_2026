topic: "Weed Management, Herbicides and Spraying Technology"
auto_figures: true
subtopics:

  - title: "Weeds: The Biggest Yield-Limiting Pest in WA Cropping"
    description: >
      Open by establishing weeds as the single most costly biotic constraint in Australian grain production, causing enormous yield loss and control cost each year. Explain how weeds damage crops: competition for the limiting resources (water above all in the Mediterranean environment, plus nitrogen and light), contamination of grain that causes downgrading or rejection, harbouring of pests and diseases, interference with harvest, and — most insidiously — the setting of a weed seedbank that perpetuates the problem for years. Introduce the two weeds that dominate WA cropping and structure this lecture: annual ryegrass (Lolium rigidum), the most important and most herbicide-resistant grass weed, and wild radish (Raphanus raphanistrum), the most important broadleaf weed. Emphasise the central strategic reality of modern weed management: decades of reliance on herbicides have driven widespread herbicide resistance, so weed control can no longer depend on chemistry alone and must integrate many tactics that exploit weed biology — the integrated weed management (IWM) philosophy that this lecture builds toward.
    key_concepts:
      - "Competition for water, nitrogen and light; grain contamination"
      - "Seedbank set perpetuates the problem across seasons"
      - "Annual ryegrass and wild radish structure the lecture"
      - "Herbicide resistance means chemistry alone is no longer enough"
    wiki_query: "weeds yield loss ryegrass wild radish herbicide resistance WA cropping"

  - title: "Annual Ryegrass: Biology and Vulnerabilities"
    description: >
      Examine annual ryegrass in detail, since understanding its life-cycle is the key to managing it. Describe its biology: a highly competitive, genetically diverse annual grass that germinates with the autumn break (in flushes), grows through winter alongside the crop, and sets abundant seed at crop maturity. Two features make it both dangerous and, paradoxically, manageable. First, its enormous genetic diversity and cross-pollinating breeding system make it extraordinarily prone to evolving herbicide resistance — ryegrass has developed resistance to more herbicide modes of action than almost any weed in the world. Second, and crucially for control, its seed is relatively short-lived in the soil: most ryegrass seed germinates or dies within a few years, so the seedbank has little persistence compared with many weeds. Explain the strategic implication of this short seedbank: if seed set can be prevented for even a few consecutive years, the seedbank can be driven down dramatically — so tactics that stop seed reaching the soil (harvest weed seed control, hay or brown-manure, crop-topping) are especially powerful against ryegrass. This is the biological foundation of the "drive the seedbank down" strategy central to IWM.
    figure_id: "Fig-L09-Ryegrass"
    image_prompt: >
      Annual ryegrass life-cycle wheel showing: autumn germination flushes with the break, winter growth competing with the crop, spring seed set at crop maturity, and a short-lived seedbank in the soil (most seed germinating or dying within 3 years). At each stage, gold (#E2B600) markers indicate a management intervention point (knockdown, pre-emergent, in-crop, harvest weed seed control, crop-topping). UWA blue (#27348B) cycle, academic diagram, --ar 16:9, --no text.
    key_concepts:
      - "Outcrossing biology drives extreme resistance evolution"
      - "Short-lived seedbank: decays within about 2-3 years no-till"
      - "Three consecutive years of control can nearly empty the seedbank"
      - "Tactics that stop seed set are especially powerful here"
    wiki_query: "annual ryegrass seedbank decay resistance outcrossing WA no-till"
    figure_source: "manual"

  - title: "Wild Radish: Biology and Vulnerabilities"
    description: >
      Contrast wild radish, the dominant broadleaf weed, whose biology demands a different strategy from ryegrass. Describe it: a vigorous, competitive broadleaf annual that germinates in flushes through the season, grows fast, competes strongly with the crop, and produces pods whose segments protect the seed. Two features distinguish it from ryegrass. First, its seed is long-lived and dormant — wild radish seed can persist in the soil for many years, germinating in staggered flushes across seasons, so a single year of seed-set prevention does not clean up the seedbank as it can with ryegrass, and control must be sustained over a long period. Second, it too has evolved significant herbicide resistance, particularly to the phenoxy and Group 2 chemistries long used against it. Explain the strategic consequences: because of its persistent seedbank and staggered germination, wild radish requires relentless, multi-year, multi-tactic control — repeated in-crop control of successive flushes, prevention of seed set, and rotation of herbicide modes of action — and cannot be beaten by a single good year. Emphasise the general lesson that emerges from comparing the two weeds: effective management is built on the specific biology and seedbank behaviour of the target weed, which is why the same IWM toolkit is deployed differently against ryegrass (short seedbank, hit seed set hard) and wild radish (long seedbank, sustain pressure for years).
    key_concepts:
      - "Persistent, dormant seedbank with staggered germination flushes"
      - "Resistance to phenoxy and Group 2 chemistry"
      - "Northern WA districts show higher resistance than the south"
      - "Requires sustained, multi-year, multi-tactic control"
    wiki_query: "wild radish seedbank dormancy resistance northern southern WA"

  - title: "Integrated Weed Management: Many Tactics, No Silver Bullet"
    description: >
      Introduce integrated weed management (IWM) as the organising framework for the rest of the lecture and the modern response to herbicide resistance, itself accelerated by WA's exceptionally high herbicide intensity (averaging around 5.4 sprays per crop per year). Define IWM as the deliberate combination of many weed-control tactics — chemical, cultural, physical, and biological — applied across the whole cropping sequence so that weeds are attacked at multiple life-cycle stages and by multiple mechanisms, so that no single tactic bears the whole burden and selection pressure for resistance to any one tactic is reduced. Survey the tactics IWM draws on, each exploiting a point in the weed life-cycle: knockdown herbicides before sowing, including the "double knock" of a systemic herbicide followed by a non-systemic one to mop up survivors; competitive crops (barley is the most weed-suppressive cereal through vigorous tillering and early canopy closure, ahead of wheat, with grain legumes the least competitive) and higher seeding rates and narrow rows to shade out weeds; rotation of crops and herbicide modes of action; break crops enabling grass-selective chemistry; pre-emergent and in-crop herbicides; strategic tillage or inversion to bury seed; hay, silage, or brown-manuring to prevent seed set; crop-topping and windrow desiccation; and harvest weed seed control (chaff carts, chaff lining, chaff decks, narrow windrow burning, and impact mills such as the Harrington Seed Destructor, which can physically destroy up to around 95% of the weed seed passing through the harvester) — a suite of tools that has become central to WA weed management. Emphasise the core principle: because weeds evolve resistance to any tactic used alone and repeatedly, durable weed control comes from diversity of pressure across the whole system — the same systems thinking that runs through the unit, applied to weeds.
    key_concepts:
      - "Double knock: systemic then non-systemic herbicide"
      - "Crop competitiveness: barley most suppressive, legumes least"
      - "Harvest Weed Seed Control can destroy up to ~95% of seed"
      - "Diversity of tactics reduces resistance selection pressure"
    wiki_query: "integrated weed management double knock harvest weed seed control competitive crop WA"

  - title: "The Importance of Herbicides — and the Threat to Them"
    description: >
      Establish why herbicides are indispensable to modern cropping and why protecting them is a strategic priority. Explain that effective, selective, affordable herbicides made no-tillage possible (weeds could be controlled chemically rather than by cultivation), enabled continuous cropping (removing the pasture phase's weed-control role), and underpin the productivity and low labour of the WA system — without them the whole conservation-agriculture edifice would collapse. Then state the threat plainly: herbicide resistance is eroding this foundation, with annual ryegrass and wild radish resistant to multiple modes of action across much of the grainbelt, and very few new herbicide modes of action have been discovered in recent decades, so the chemistry cannot be assumed to be replaced. This gives every grower a resistance-management responsibility — using herbicides in ways that slow resistance and preserve their effectiveness for the future, exactly as canola herbicide-tolerance stewardship and glyphosate protection require. Frame the following slides as building the understanding of how herbicides work, are classified, and are labelled that is needed to use them wisely and to manage resistance.
    key_concepts:
      - "Herbicides enabled no-till and continuous cropping"
      - "Resistance across multiple MOA groups in ryegrass and wild radish"
      - "Few new herbicide modes of action discovered in recent decades"
      - "Every grower carries a resistance-management responsibility"
    wiki_query: "herbicide no-till continuous cropping resistance new modes of action"

  - title: "Selective versus Non-Selective Herbicides"
    description: >
      Introduce the most basic functional classification of herbicides. Non-selective herbicides kill or damage a broad range of plants — both weeds and crops — and so are used where no crop is present or must be protected: as knockdown treatments before sowing (glyphosate being the pre-eminent example, alongside paraquat), for fallow weed control, and for pre-harvest and inter-row applications where contact with the crop is avoided. Selective herbicides discriminate between crop and weed, killing the weed while leaving the crop unharmed, which is what allows in-crop weed control. Explain the biological basis of selectivity: it arises from differences between crop and weed in how the herbicide is intercepted, absorbed, moved, and — most importantly — metabolised (a tolerant crop breaks the herbicide down to harmless products before it acts, while the susceptible weed cannot), or from differences in the target site the herbicide attacks. This same metabolic basis of selectivity underlies both crop safety and, ominously, one form of resistance (metabolic resistance, developed later). Emphasise that selectivity is often partial and dependent on rate, growth stage, and conditions, which is why label rates and stage windows matter, and why an in-crop herbicide applied outside its window can damage the crop.
    key_concepts:
      - "Non-selective: glyphosate, paraquat for knockdown/fallow"
      - "Selective herbicides discriminate crop from weed"
      - "Selectivity arises from metabolism or target-site differences"
      - "Selectivity is often partial: rate, stage and conditions matter"
    wiki_query: "selective non-selective herbicide glyphosate metabolism target site"

  - title: "Soil-Applied (Pre-Emergent) Herbicides"
    description: >
      Explain how soil-applied, pre-emergent herbicides work and the factors governing their performance — a class of growing importance as resistance has pushed growers back toward pre-emergents. These herbicides are applied to the soil before or at sowing and act on germinating weed seeds and emerging seedlings, being taken up by the roots or shoots of the emerging weed. Their efficacy depends on the herbicide reaching and persisting in the zone where weed seeds germinate at an active concentration. Explain the factors that affect their behaviour and persistence: soil binding (herbicides bind to clay and organic matter, so binding-prone products are less available and need higher rates on high-organic or clay soils, and can be tied up by stubble before reaching the soil); solubility and mobility (which govern how the herbicide moves with soil water into the germination zone — too little movement and it never reaches the weed, too much and it leaches past or into the crop seed); and degradation (by microbial breakdown, which is faster in warm, moist soils, and by chemical and photo-degradation), which determines how long the herbicide persists and therefore both its length of control and its plant-back risk to following crops. Emphasise the practical consequences: stubble interception can reduce efficacy in retained-stubble systems, persistence creates plant-back constraints that must be tracked in records, and matching product, rate, and placement to soil type and conditions is essential. Pre-emergents are a vital resistance-management tool because they attack weeds at a different life-stage and with different chemistry than post-emergents.
    key_concepts:
      - "Act on germinating seeds and emerging seedlings from the soil"
      - "Soil binding, solubility and mobility govern reaching the target"
      - "Degradation rate sets length of control and plant-back risk"
      - "Stubble interception can reduce efficacy in retained-stubble systems"
    wiki_query: "pre-emergent soil-applied herbicide binding degradation plant-back"

  - title: "Foliar (Post-Emergent) Herbicides and Translocation"
    description: >
      Explain how foliar, post-emergent herbicides work once weeds have emerged. These are sprayed onto growing weeds and must be intercepted by and retained on the leaf, penetrate the waxy cuticle, and reach their site of action. Distinguish two behaviours. Contact herbicides act at or near the point of contact, killing the tissue they touch (requiring thorough coverage of the whole weed to be effective, since untouched tissue survives — paraquat is the classic example). Systemic (translocated) herbicides are absorbed and moved within the plant through its transport systems to growing points and roots, killing tissue distant from the point of contact (glyphosate and the phenoxies are systemic) — these need less complete coverage but require the weed to be actively growing to translocate the herbicide. Explain the practical implications: coverage requirements differ (fine, complete coverage for contact herbicides; adequate but less exhaustive coverage for systemic), and weed condition matters greatly (a stressed, hardened, or dormant weed absorbs and translocates poorly, so herbicides work best on young, actively growing weeds under good conditions). This links directly to the spray-quality and weather content in Part 3, since droplet size, coverage, and conditions determine whether the herbicide is delivered effectively to its target.
    key_concepts:
      - "Contact herbicides: kill on touch, need thorough coverage"
      - "Systemic herbicides: translocate to growing points and roots"
      - "Actively growing weeds absorb and translocate best"
      - "Links coverage/droplet-size choices to spray-quality content"
    wiki_query: "foliar post-emergent contact systemic herbicide translocation"

  - title: "Modes of Action and Why They Are Grouped"
    description: >
      Explain the concept of herbicide mode of action (MOA) and why herbicides are grouped by it — the single most important idea in resistance management. Define mode of action as the specific biochemical process in the plant that the herbicide disrupts (for example, inhibiting an enzyme essential to amino acid synthesis, blocking photosynthesis, or disrupting cell division or growth-hormone regulation). Explain that herbicides sharing a mode of action attack the same target, so a weed that evolves resistance to one herbicide is typically resistant to all herbicides of that mode of action (cross-resistance) — meaning the meaningful unit for resistance management is the mode-of-action group, not the individual product. This is why herbicides are labelled with a mode-of-action group (in Australia now a numeric group code, part of the global HRAC system), and why the golden rule of resistance management is to rotate and mix modes of action so that no single MOA group bears repeated, sole selection pressure. Give the strategic picture: resistance in WA is most acute in Group 1 (ACCase inhibitor) and Group 2 (ALS inhibitor) herbicides specifically, the two mainstay grass and broadleaf chemistries, and because ryegrass and wild radish are already resistant to several groups and new groups are scarce, growers must deliberately diversify the MOA groups they use across the rotation and combine them with the non-chemical tactics of IWM. Emphasise that understanding MOA groups turns a bewildering array of trade-named products into a manageable strategic framework.
    figure_id: "Fig-L09-MOA"
    image_prompt: >
      Diagram of a plant cell with labelled target sites where different herbicide mode-of-action groups act (amino-acid synthesis inhibition, photosynthesis inhibition, cell-division inhibition, auxin/growth disruption, lipid synthesis inhibition), each with its group code. To the side, a rotation wheel showing MOA groups being alternated across seasons to prevent resistance. UWA blue (#27348B) cell, gold (#E2B600) target-site markers and group codes, academic diagram, --ar 16:9, --no text.
    key_concepts:
      - "Mode of action: the biochemical process disrupted"
      - "Cross-resistance: resistance to one MOA extends to the group"
      - "HRAC numeric group codes on Australian labels"
      - "Group 1 (ACCase) and Group 2 (ALS) are highest resistance risk"
    wiki_query: "herbicide mode of action HRAC group ACCase ALS cross-resistance"
    figure_source: "manual"

  - title: "Herbicide Resistance: Target-Site versus Metabolic"
    description: >
      Develop the mechanisms of herbicide resistance, since understanding them explains why resistance spreads and how to slow it. Define resistance as the inherited ability of a weed population to survive a herbicide dose that once controlled it — an evolutionary response to the selection pressure of repeated herbicide use, in which rare naturally-resistant individuals survive, set seed, and come to dominate the population. Distinguish the two main mechanisms. Target-site resistance: a mutation changes the herbicide's target protein so the herbicide can no longer bind and act; it typically confers strong resistance to that mode of action (and to others sharing the target), is often specific, and is the more predictable form. Metabolic resistance: the weed evolves enhanced ability to break the herbicide down before it acts (using the same detoxification systems that give crops their selectivity); this is more insidious because it can confer resistance across multiple, chemically unrelated modes of action simultaneously (including ones the weed has never been exposed to), is harder to predict, and can undermine new chemistry. Note a genuinely counter-intuitive finding from resistance modelling (tools such as RIM and PERTH, developed for WA conditions): cutting herbicide doses to save money can paradoxically accelerate resistance evolution, because low doses still kill susceptible plants but let weakly-resistant individuals survive and breed, so effective resistance management must be judged over a long, roughly decade-long economic horizon, not season to season. Explain the sobering implication for WA: annual ryegrass in particular has extensive metabolic and target-site resistance across many MOA groups, so growers cannot rely on finding a new herbicide to solve the problem, and the only durable answer is to reduce total reliance on herbicides through IWM and to protect the remaining effective chemistry by rotating MOA groups and driving the weed seedbank down by non-chemical means. This is the strategic heart of modern WA weed management.
    key_concepts:
      - "Target-site resistance: mutated target protein, predictable"
      - "Metabolic resistance: cross-MOA detoxification, harder to predict"
      - "Low doses can paradoxically accelerate resistance evolution"
      - "Resistance management judged over a decade-long horizon"
    wiki_query: "target-site metabolic herbicide resistance dose RIM modelling WA"

  - title: "The Legal and Safety Framework of Agrochemical Use"
    description: >
      Before the technology, establish that using agrochemicals carries legal obligations and responsibilities. Explain that there are legal requirements governing who may recommend, supply, apply, and store agricultural chemicals: product registration and label directions are legally binding (the label is a legal document — off-label use is generally an offence), applicators and advisers require appropriate training and accreditation, records of chemical use must be kept, and there are strict rules on storage, transport, and disposal, on withholding periods and maximum residue limits that protect the grain's marketability and consumer safety, and on avoiding off-target damage to neighbours, sensitive crops, waterways, and native vegetation. Emphasise the seriousness of spray drift liability and the duty of care an applicator owes to others, and the market consequence of residue breaches (a contaminated load can jeopardise a shipment and a market). Establish the professional standard the unit expects: agrochemicals are powerful, valuable, and hazardous tools used within a legal and ethical framework, and competent, responsible application is a core professional skill — the foundation on which the technical spraying content rests.
    key_concepts:
      - "Label is a legal document; off-label use is generally an offence"
      - "Accreditation, record-keeping, storage and disposal rules"
      - "Withholding periods and maximum residue limits protect markets"
      - "Spray-drift liability and duty of care to neighbours"
    wiki_query: "herbicide label legal withholding period residue drift liability WA"

  - title: "Spray Quality: Droplet Size, Efficacy and Drift"
    description: >
      Introduce the central concept of spray application: droplet size, and the fundamental trade-off between efficacy and drift that governs every spraying decision. Explain that a spray is never uniform but a spectrum of droplet sizes produced by atomisation — the mechanical shearing of the bulk liquid at the nozzle to maximise surface area and distribution — characterised by droplet diameter in microns and summarised in spray-quality categories from very fine through fine, medium, coarse, to very coarse and ultra coarse. Introduce the standard way this spectrum is quantified: the Volume Median Diameter (VMD, or Dv0.5) is the diameter at which half the spray volume is in smaller droplets and half in larger; the fine tail of the spectrum (Dv0.1) is the highly drift-prone fraction, while the coarse tail (Dv0.9) is droplets liable to bounce or roll off the leaf, wasting active ingredient — so the applicator's real goal is not simply "big" or "small" droplets but a narrow spectrum concentrated in the size range that is biologically effective for the target and product while minimising both driftable fines and wasteful coarses. Explain the trade-off in practical terms. Small (fine) droplets give excellent coverage — many droplets per unit area, better retention on small or vertical targets, and superior performance for contact herbicides and difficult targets — but are highly prone to drift and to evaporation before reaching the target. Large (coarse) droplets resist drift and evaporation, landing where intended, but give poorer coverage and can run off or bounce. Explain that the optimum droplet size depends on the target and product: fine droplets for contact herbicides and small weeds needing coverage; coarser droplets for systemic herbicides (which translocate and need less coverage) and, critically, for drift reduction near sensitive areas. Emphasise that matching spray quality to the job — through nozzle choice and pressure — is the applicator's key lever for balancing efficacy against the ever-present drift risk, a balance sharpened by the legal drift obligations of the previous slide.
    figure_id: "Fig-L09-Droplet"
    image_prompt: >
      Diagram illustrating the droplet-size trade-off and spectrum. A bell-curve of droplet sizes (Dv0.1, Dv0.5/VMD, Dv0.9) transitioning from a fine, drift-prone tail on the left to an optimal middle range to a coarse, runoff-prone tail on the right. Below, paired panels: "Fine droplets" showing dense leaf coverage with drift/evaporation arrows; "Coarse droplets" showing sparse coverage landing on target with minimal drift. UWA blue (#27348B) curve and target leaf, gold (#E2B600) droplets and drift arrows, academic diagram, --ar 16:9, --no text.
    key_concepts:
      - "Droplet spectrum quantified by VMD (Dv0.5), with Dv0.1/Dv0.9 tails"
      - "Fine droplets: coverage but drift/evaporation risk"
      - "Coarse droplets: drift-resistant but poorer coverage"
      - "Goal: narrow spectrum matched to target and product"
    wiki_query: "droplet size spectrum VMD spray quality drift coverage"
    figure_source: "manual"

  - title: "Hydraulic Nozzles: Types, Coding and Selection"
    description: >
      Explain the hydraulic nozzle as the heart of the sprayer — the component that meters flow and determines droplet size and pattern — and how nozzles are classified and selected. Describe the main nozzle types and their spray characteristics and uses: flat fan nozzles (the workhorse for broadacre boom spraying, producing a fan-shaped pattern that overlaps along the boom for even coverage); air-induction (venturi) nozzles that draw air into the nozzle body to create large, air-filled droplets that resist wind drift but shatter into smaller droplets on impact with the leaf, effectively decoupling droplet size in flight from coverage on the target — now the broadacre standard for drift mitigation at the high speeds and pressures modern booms run; and specialty nozzles (even fan, hollow cone, twin-jet, and others) for particular jobs. Contrast this hydraulic approach with Controlled Droplet Application (CDA) or rotary atomizers, which use spinning discs rather than pressure to shear fluid into a highly uniform droplet spectrum with a drastically reduced fine, driftable fraction, enabling ultra-low-volume (ULV) application; these remain specialist tools, particularly for aerial application, where spectrum uniformity matters more than the flexibility of a hydraulic system. Explain how hydraulic nozzles are coded and rated: by a colour-coded standard (ISO) indicating flow rate at a reference pressure, by fan angle, and by spray-quality rating at given pressures — so a nozzle's colour and code tell the applicator its output and typical droplet spectrum, allowing rational selection. Explain the selection logic: choose the nozzle to deliver the required application volume at the intended speed and pressure while producing the spray quality suited to the target and the drift risk. Emphasise that nozzle choice, together with pressure, is how the applicator controls both how much is applied and the droplet spectrum, and that the shift to air-induction nozzles has been a major advance in reconciling efficacy with drift reduction.
    key_concepts:
      - "Flat fan: the broadacre workhorse, overlapping pattern"
      - "Air-induction (venturi): drift-resistant, shatters on impact"
      - "CDA/rotary atomizers: uniform spectrum, ULV, mainly aerial"
      - "ISO colour-coding tells output and droplet spectrum"
    wiki_query: "hydraulic nozzle air induction venturi flat fan CDA rotary atomizer"

  - title: "Boom Set-Up: Nozzle Spacing, Boom Height and Pattern Evenness"
    description: >
      Explain how the physical set-up of the spray boom determines whether the chemical is applied evenly across the ground — a major and often overlooked source of poor performance. Describe the boom spray's components: the tank, pump, agitation, filters, pressure regulation and control system, boom with regularly-spaced nozzles, and the plumbing delivering spray to each nozzle. Focus on the geometry of even coverage. Nozzle spacing and boom height must be matched so that adjacent flat-fan patterns overlap correctly at the target height — flat fans are engineered to give even coverage only when their patterns overlap by the right amount, so the boom must be held at the height (for the given nozzle spacing and fan angle) that produces this overlap. A boom too low leaves striped under-dosed and over-dosed bands between nozzles; a boom too high improves overlap but increases drift and pattern distortion in wind. Explain why holding that height is now a genuine engineering challenge: modern booms span 36 to 48 metres and travel at up to around 25 km/h, subjecting them to yaw (whiplash), roll, and vertical bounce over rough ground, so modern sprayers use active suspension — nitrogen accumulators, pendulums, and dampeners — to isolate the boom from chassis movement, together with ultrasonic or radar automated height-control systems that continuously measure distance to the soil or canopy and dynamically adjust the boom wings to hold optimal nozzle overlap. Explain the consequences of poor set-up: streaky, uneven application that leaves weed escapes (fuelling resistance) or crop damage, wasted chemical, and increased drift — a boom that dips too low causes severe striping, while one that swings high exponentially increases the time droplets spend exposed to crosswinds. Emphasise that boom stability is the unsung hero of drift reduction, and that correct boom height and nozzle spacing are fundamental to getting the value out of the chemical loaded in the tank.
    key_concepts:
      - "Nozzle overlap geometry sets the correct boom height"
      - "Too low: striping; too high: drift and pattern distortion"
      - "Active suspension isolates the boom from chassis movement"
      - "Automated ultrasonic/radar height control on wide, fast booms"
    wiki_query: "spray boom height nozzle overlap suspension automated height control"

  - title: "Sprayer Calibration: Getting the Rate Right"
    description: >
      Teach the essential skill of sprayer calibration — ensuring the sprayer actually applies the intended rate of chemical per hectare — from first principles. Explain the fundamental relationship that governs application volume: the volume applied per hectare depends on the nozzle flow rate, the nozzle spacing, and the travel speed, linked by a simple equation that students should be able to derive and apply. Application rate rises with nozzle flow (set by nozzle size and pressure) and falls with faster travel speed and wider nozzle spacing. Walk through calibration in practice: measuring actual nozzle output, checking it against the target, and adjusting speed, pressure, or nozzles to hit the intended volume, then loading the correct chemical concentration to deliver the label rate of active ingredient. Explain the pros and cons of using pressure to change output: pressure is a quick, on-the-go adjustment, but it changes output only weakly (output rises with the square root of pressure, so large pressure changes give small rate changes) and, critically, changing pressure changes droplet size (higher pressure makes finer, more drift-prone droplets), so pressure is a poor and risky way to make large rate changes — nozzle or speed changes are preferred. Emphasise that calibration is a routine discipline, not a one-off, because worn nozzles over-deliver and drift, and that both calibration by calculation and by spray charts/formulae are standard professional practice.
    key_concepts:
      - "Rate depends on nozzle flow, spacing and travel speed"
      - "Pressure is a weak, risky lever: output scales with its square root"
      - "Changing pressure also changes droplet size"
      - "Calibration is routine, not one-off; worn nozzles over-deliver"
    wiki_query: "sprayer calibration nozzle flow rate pressure speed application volume"

  - title: "Modern Spray Systems: Pulse Width Modulation and Beyond"
    description: >
      Introduce the modern electronic spray technologies that have transformed application, chief among them pulse width modulation (PWM). Explain the limitation of conventional systems that PWM overcomes: in a conventional sprayer, rate is tied to pressure and speed, so slowing down (e.g. on a corner) over-applies and speeding up under-applies, and changing speed changes droplet size. PWM decouples these by using electric solenoids at every nozzle to pulse flow on and off rapidly — commonly 10 to 50 times per second — and varying the duty cycle (the proportion of time open) to control flow, so the sprayer can lock in a constant pressure (and therefore constant droplet size) while varying application rate with speed. This gives three concrete operational benefits: even application while decelerating into corners, individual nozzle control for section control (shutting off nozzles over already-sprayed ground), and true turn-compensation, where outer nozzles on a wide boom pulse faster and inner nozzles pulse slower during a turn to prevent over-dosing the inside of the arc. Mention related systems: automatic section control and boom levelling. Note that PWM's high-fidelity flow control is also the foundation for the next generation of targeted spraying — optical and variable-rate systems, covered next — which go a step further than simply controlling rate evenly, instead deciding where to spray at all. Emphasise that spray technology is advancing rapidly and that it directly serves both efficiency and the overriding goal of using less herbicide more precisely to combat resistance.
    key_concepts:
      - "PWM: solenoid pulsing decouples pressure/droplet size from rate"
      - "Constant droplet size regardless of travel speed"
      - "Turn-compensation: differential pulsing across a wide boom"
      - "Section control shuts off nozzles over sprayed ground"
    wiki_query: "pulse width modulation PWM sprayer duty cycle turn compensation section control"

  - title: "Optical Weed Detection: Machine Vision and Targeted Spraying"
    description: >
      Extend the PWM story to its logical conclusion: technology that decides not just how much to spray but where. Introduce optical spot-spraying as a paradigm shift from broadcast application to targeted, plant-specific intervention. Outline the evolution of this technology, starting with "green-on-brown" systems (such as WEEDit and WeedSeeker) that use active light sources and near-infrared reflectance to detect the chlorophyll of living weeds against bare soil or stubble, triggering individual nozzles to spray only the weed — the natural fit for fallow and pre-seeding knockdowns. Then describe the frontier of "green-on-green" technology, which uses high-resolution cameras, edge computing, and deep-learning models to visually distinguish weed species from the growing crop in real time, extending spot-spraying into in-crop situations. Discuss the profound agronomic and economic impact: chemical savings commonly in the order of 50-90%, which makes it affordable to deploy expensive, alternative modes of action on resistant weed blow-outs that would be uneconomic to spray broadacre, directly supporting the resistance-management and IWM goals set out earlier. Emphasise that machine vision turns the sprayer from a blunt broadcast instrument into a precision prescription tool.
    key_concepts:
      - "Green-on-brown (WEEDit, WeedSeeker) for fallow/pre-seeding"
      - "Green-on-green: AI distinguishes weed from crop in-crop"
      - "Chemical savings of roughly 50-90%"
      - "Makes expensive alternative MOAs viable on resistant blow-outs"
    wiki_query: "optical spot spraying green on brown green on green weed detection machine vision"

  - title: "Unmanned Aerial Vehicles (UAVs) in Herbicide Application"
    description: >
      Round out the survey of spray technology with agricultural drones, a smaller but growing niche. Explain the unique aerodynamics of rotary-wing UAVs: rotor downwash can push droplets deep into a dense canopy, but can also cause turbulence, lateral vortexes, and unpredictable drift if not managed carefully. Discuss where UAVs actually fit in a WA system: treating steep, waterlogged, or otherwise inaccessible terrain that a boom sprayer cannot reach; spot-treating localised weed patches already identified by drone-mapping or optical-detection missions; and, at scale, operating in coordinated swarms. Note the current limitations that keep UAVs a niche rather than a broadacre replacement — payload capacity, battery life, and regulatory constraints on aerial application near sensitive areas. Emphasise that drones will not replace the broadacre boom sprayer in WA in the near term, but they add a highly targeted, low-compaction option that integrates into a digitised, spatial weed-management strategy alongside optical spot-spraying.
    key_concepts:
      - "Rotor downwash aids canopy penetration but risks turbulence/drift"
      - "Niche fit: inaccessible terrain, spot patches, swarm operation"
      - "Limits: payload, battery life, aerial application regulation"
      - "Complements, does not replace, the broadacre boom sprayer"
    wiki_query: "agricultural drone UAV spray application rotor downwash WA"

  - title: "Adjuvants and the Influence of Weather"
    description: >
      Close the lecture with the factors that determine whether a correctly calibrated, well-targeted spray actually works: what is in the tank, and the weather it is applied into. Inside the tank, modern spray mixes are complex chemical soups whose rheology (flow behaviour) matters as much as their biology. Adjuvants are substances added to improve performance: surfactants and wetters that reduce surface tension so droplets spread and penetrate the waxy leaf; oils (crop, mineral, and vegetable-based) that enhance uptake through the cuticle; formulation and water-conditioning agents such as ammonium sulphate to counter hard water, whose cations can bind to and antagonise glyphosate; and specialised drift-reduction adjuvants (DRAs), which use long-chain polymers to increase fluid elasticity and suppress the formation of fine, driftable droplets at the nozzle tip. Distinguish physical incompatibility, where tank-mixed products precipitate, gel, or block filters, from biological antagonism, where one chemical simply reduces another's efficacy without any visible physical sign — both are reasons tank mixes must follow label guidance and compatibility testing, not assumption. Explain that adjuvants can markedly improve efficacy but also carry risks — the wrong adjuvant or too much can increase crop damage, alter droplet size and drift, or cause incompatibility. Then address weather, which governs both efficacy and drift. Temperature and humidity: hot, dry conditions stress weeds (reducing uptake and translocation) and increase droplet evaporation and drift, while very cold conditions slow weed metabolism and herbicide activity; Delta-T, the difference between dry-bulb and wet-bulb temperature, is the standard combined index for judging evaporation risk, and spraying should stop when it is too high (droplets evaporate before uptake) or too low (dew and runoff risk). Wind: light, steady wind is needed to avoid the calm conditions that cause temperature inversions — on clear, still nights the ground rapidly cools the air immediately above it, trapping a dense layer of cold air under warmer air, so fine droplets caught in this layer do not settle but hang suspended and can drift laterally for kilometres in light breezes, a major cause of serious, unpredictable off-target damage — while strong wind causes immediate physical drift, leaving a genuine safe wind window in between. Emphasise the integrating message: effective, responsible spraying combines the right chemistry, correct calibration and nozzle choice, appropriate adjuvant, and suitable weather — and getting all of these right, within the legal framework, is what turns the herbicide in the tank into weed control without off-target harm. Reinforce that all of this technology ultimately serves the strategic goal established at the start: controlling weeds effectively while preserving the chemistry through resistance-aware, integrated management.
    key_concepts:
      - "Adjuvant types: surfactants, oils, water-conditioners, DRAs"
      - "Physical incompatibility vs biological antagonism in tank mixes"
      - "Delta-T as the standard evaporation-risk index"
      - "Temperature inversions trap fine droplets, cause long-distance drift"
    wiki_query: "adjuvants tank mix compatibility Delta-T temperature inversion drift weather"

