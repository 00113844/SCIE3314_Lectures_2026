topic: "Agronomy of Canola"
auto_figures: true
subtopics:

  - title: "From Rapeseed to Canola: The Breeding Triumph"
    description: >
      Open with the origin story that defines the crop, because canola is a product of plant breeding in a way no other broadacre crop is. Rapeseed (Brassica napus) was historically an industrial oilseed unfit for food or feed because its oil was high in erucic acid (a fatty acid with adverse health effects) and its meal was high in glucosinolates (compounds toxic and unpalatable to livestock). In the 1960s–70s Canadian breeders selected out both traits, creating "double-low" rapeseed — low erucic acid in the oil and low glucosinolate in the meal — and named it canola (from "Canadian oil, low acid"). This transformed a minor industrial crop into one of the world's most important edible oilseeds and protein meals. Emphasise the lesson: the entire canola industry exists because breeding redefined the crop's quality, and quality specifications (low erucic acid, low glucosinolate) remain the legal definition of canola. Establish canola's rise in WA and Australia from the 1990s to become the dominant break crop and a major export earner, and preview why it is grown: as a valuable oilseed cash crop and as a powerful rotational break for cereals.
    key_concepts:
      - "Double-low breeding: low erucic acid, low glucosinolate"
      - "Quality specifications are the legal definition of canola"
      - "WA/Australia canola rise from the 1990s as a break crop and export earner"
    wiki_query: "canola breeding quality erucic acid glucosinolate WA production history"

  - title: "Why Grow Canola? The Break-Crop Value"
    description: >
      Explain canola's dual value proposition that drives its place in the rotation. As a cash crop: canola is a high-value oilseed sold into strong, growing markets — edible oil and high-protein meal for feed, and increasingly biodiesel feedstock, particularly for the European Union where sustainability certification earns premiums. As a break crop: canola is a broadleaf, non-host to the major cereal root diseases (take-all, crown rot) and delivers a powerful disease break that lifts the yield of the following cereal; critically, it is a non-grass crop, so it permits the use of grass-selective herbicides and herbicide-tolerance systems that clean up grass weeds (especially annual ryegrass) which cannot be selectively controlled in a cereal — making canola a cornerstone of integrated weed management. It also leaves a residue that decomposes readily and can improve soil structure and water infiltration. Emphasise the systems accounting introduced earlier: canola's value is realised partly in its own gross margin and partly in the yield lift and weed clean-up it delivers to the subsequent cereal, so its place in the rotation must be judged across the sequence, not on its single-year return alone. Note its higher risk than cereals — smaller seed, more demanding establishment, and greater sensitivity to stress — which concentrates canola in the medium and higher rainfall zones.
    key_concepts:
      - "Cash value: oilseed, meal, and biodiesel feedstock markets"
      - "Disease break: non-host to take-all and crown rot"
      - "Weed break: grass-selective herbicides clean up ryegrass"
      - "Value judged across the rotation, not the single-year return"
    wiki_query: "canola break crop rotation value disease weed management WA"

  - title: "The Canola Plant and Its Yield Formation"
    description: >
      Introduce canola's growth habit and how it forms yield, contrasting it with cereals to explain its different agronomy and risk profile. Describe the plant: a small seed germinating to a rosette of leaves, then bolting to produce a branched flowering structure bearing many yellow flowers that set pods (siliques), each containing small oil-rich seeds. Explain yield formation through its components — plants per unit area, pods per plant (driven by branching and flower number), seeds per pod, and seed weight — and note that, like cereals with tillering, canola compensates through branching, producing more branches and pods per plant at low density. Stress the critical difference from cereals: canola's small seed makes establishment far more sensitive to sowing depth, seedbed moisture, and conditions, so establishment failure is a real risk in a dry start; and its long flowering period, while offering some buffering, coincides with the spring window where heat, moisture stress, and frost can all damage pod and seed set. Explain the oil dimension: because the harvested product is oil-rich seed, and oil synthesis is energetically costly, canola's yield per unit of intercepted radiation, expressed as seed, is lower than a cereal's — the physiological reason canola yields fewer tonnes per hectare than wheat but at a higher price per tonne. Oil content itself is a quality and price parameter, developed later.
    key_concepts:
      - "Yield components: plants/pods/seeds per unit, seed weight"
      - "Compensation through branching at low density"
      - "Small seed raises establishment sensitivity"
      - "Oil synthesis cost explains lower tonnage than cereals"
    wiki_query: "canola yield components branching establishment oil content seed set"

  - title: "Breeding Objectives: What Canola Breeders Select For"
    description: >
      Set out the key objectives of modern canola breeding programs, since the choice among canola types is one of the most important decisions in the crop's agronomy. Quality: maintaining the defining low erucic acid and low glucosinolate status, and increasingly breeding for higher oil content (directly priced) and specialty oil profiles (such as high-oleic oils for food processing). Yield and vigour: raising yield potential and early vigour for reliable establishment, with hybrid breeding delivering strong hybrid vigour (heterosis) for establishment, biomass, and yield. Phenology: matching maturity to different sowing windows and environments, including the development of longer-season winter canola types for early sowing and grazing. Disease resistance: above all resistance to blackleg, canola's most damaging disease, plus sclerotinia tolerance. Herbicide tolerance: engineering or selecting tolerance to specific herbicides to enable in-crop grass and broadleaf weed control — the trait that defines the canola "types" and drives the weed-management value of the crop. Stress that these objectives interact and trade off (a high-yielding hybrid may cost more in seed; a herbicide- tolerance trait may carry a small yield penalty), and that variety choice integrates yield, maturity, disease resistance, herbicide-tolerance system, and seed cost. This framing motivates the survey of types that follows.
    key_concepts:
      - "Quality: erucic acid, glucosinolate, oil content, specialty profiles"
      - "Yield, vigour and hybrid heterosis"
      - "Phenology: spring vs winter maturity types"
      - "Blackleg and sclerotinia resistance; herbicide tolerance"
    wiki_query: "canola breeding objectives yield disease resistance herbicide tolerance hybrid"

  - title: "Triazine-Tolerant (TT) Canola"
    description: >
      Describe the herbicide-tolerance systems that define canola types, beginning with triazine-tolerant (TT) canola, historically the dominant type in WA. Explain that TT canola carries a naturally-derived tolerance to triazine herbicides (such as atrazine and simazine), allowing these cheap, effective, residual herbicides to be sprayed over the crop to control a broad spectrum of grass and broadleaf weeds — a major weed-control benefit in the weed-pressured WA system. Explain the critical trade-off that students must understand: the triazine-tolerance trait reduces photosynthetic efficiency, so TT varieties carry an inherent yield penalty (commonly around 10–20%) relative to non-TT types of equivalent breeding. Discuss why, despite this penalty, TT canola became so widely grown in WA: the value of robust, affordable weed control on weedy paddocks, and the ability to use canola as a grass-weed clean-up crop, often outweighed the yield cost, especially where ryegrass pressure was severe. Note the environmental consideration — triazine residues and their management — and the trend, with the arrival of newer systems and higher-yielding hybrids, toward TT losing share to Roundup Ready and Clearfield types. TT remains a case study in the constant agronomic trade-off between weed control and yield potential.
    key_concepts:
      - "TT tolerance enables cheap, residual triazine herbicides"
      - "Inherent yield penalty of roughly 10-20%"
      - "Trade-off: weed control value vs yield cost on weedy paddocks"
      - "Losing share to Roundup Ready and Clearfield systems"
    wiki_query: "triazine tolerant TT canola yield penalty herbicide resistance WA"

  - title: "Clearfield (Imidazolinone-Tolerant) and Roundup Ready Canola"
    description: >
      Continue the survey of herbicide-tolerance systems with the two other major types. Clearfield canola carries tolerance to imidazolinone (Group 2) herbicides, allowing in-crop control of certain broadleaf and grass weeds with these chemicals; its advantages include useful weed spectrum and lower yield penalty than TT, but its important limitation is the long soil residual of imidazolinone herbicides, which impose plant-back restrictions on following crops and, because Group 2 chemistry is heavily relied upon and resistance-prone, must be managed within a resistance strategy. Roundup Ready (glyphosate-tolerant) canola is a genetically modified type tolerant to glyphosate, permitting one or two in-crop applications of this cheap, highly effective, broad-spectrum, non-residual knockdown herbicide — offering excellent weed control with minimal yield penalty and no plant-back concern, and now widely adopted in WA following the lifting of the state's GM moratorium. Explain the responsibilities that come with it: strict adherence to application windows and stewardship to protect the invaluable glyphosate resource from resistance, and market and segregation management for GM grain. Emphasise that each system is a different tool with its own weed spectrum, yield cost, residual behaviour, resistance risk, and market implications, and that the choice is a strategic weed-management and marketing decision, not merely a variety preference.
    figure_id: "Fig-L07-CanolaTypes"
    image_prompt: >
      Comparison table-style infographic of four canola herbicide-tolerance systems: TT (triazine), Clearfield (imidazolinone), Roundup Ready (glyphosate), and Conventional. For each, icons/indicators for weed-control spectrum, relative yield potential, herbicide residual/plant-back risk, and resistance-management concern. UWA blue (#27348B) headers, gold (#E2B600) highlight cells, clean academic comparison graphic, --ar 16:9, --no text.
    key_concepts:
      - "Clearfield: imidazolinone tolerance, residual plant-back risk"
      - "Roundup Ready: glyphosate tolerance, minimal yield penalty"
      - "GM moratorium lifting enabled RR adoption in WA"
      - "Choice is a weed-management and marketing decision"
    wiki_query: "Clearfield Roundup Ready canola herbicide tolerance WA glyphosate resistance"
    figure_source: "literature"

  - title: "Next-Generation Herbicide Tolerance: Stacked Traits and Advanced Systems"
    description: >
      Expand on weed control by introducing the latest generation of herbicide tolerance technologies. Discuss the rapid adoption of 'stacked' or dual-trait hybrids — such as Triazine Tolerant plus Clearfield (TT+CL) or Triazine Tolerant plus glyphosate tolerance (e.g., TruFlex) — which allow growers to deploy multiple herbicide modes of action in a single season. Explain how this flexibility provides robust control of hard-to-kill, multi-resistant weeds (like annual ryegrass and wild radish) while helping manage the risk of herbicide carryover from previous crops. Introduce advanced glyphosate-tolerant systems like TruFlex and Optimum GLY, which offer wider application windows and allow higher chemical rates than first-generation Roundup Ready. Emphasize the critical stewardship required: while stacked traits are powerful tools, over-reliance without integrated weed management (such as Harvest Weed Seed Control) risks accelerating complex, multi-herbicide resistance.
    key_concepts:
      - "Stacked Herbicide Traits"
      - "TruFlex and Optimum GLY"
      - "Multi-Herbicide Resistance"
    wiki_query: "canola stacked herbicide traits truflex optimum gly"

  - title: "Hybrids, Open-Pollinated Varieties and Winter Canola"
    description: >
      Cover the other axes of canola variety choice beyond herbicide tolerance. Hybrid versus open-pollinated: hybrid canola exploits hybrid vigour for stronger early establishment (valuable given canola's establishment risk), more biomass, better blackleg resistance packages, and higher yield, but seed is more expensive and cannot be retained for resowing; open-pollinated (including many TT) varieties have cheaper, retainable seed but generally lower vigour and yield. The trend in WA is strongly toward hybrids as their yield and vigour advantages, particularly in Roundup Ready systems, justify the seed cost. Spring versus winter canola: most Australian canola is spring type (no vernalisation requirement, sown in the main autumn window), but longer-season winter types (with a vernalisation requirement delaying flowering) have emerged for early sowing in higher-rainfall zones and for dual-purpose grazing-plus-grain use, where the crop is grazed by sheep through winter before being locked up to flower and set seed. Explain how these choices interact with sowing date, rainfall zone, and enterprise mix, and reinforce that variety selection integrates herbicide system, hybrid status, maturity, blackleg resistance, and seed cost into a single decision matched to the paddock and season.
    key_concepts:
      - "Hybrid vigour vs cheaper, retainable OP seed"
      - "WA trend toward hybrids, especially in RR systems"
      - "Spring vs winter (vernalisation) types"
      - "Dual-purpose grazing-plus-grain winter canola"
    wiki_query: "hybrid open pollinated canola vigour winter type vernalisation grazing"

  - title: "Canola Establishment and Early Vigour"
    description: >
      Focus on establishment, the highest-risk phase of canola agronomy and the one that most distinguishes it from cereals. Explain the challenge: canola's very small seed carries little reserve, so it must be sown shallow (typically just 1–2 cm) into moist soil, making it acutely dependent on seedbed moisture and vulnerable to a drying surface, crusting, and pests (slugs, lucerne flea, redlegged earth mite, and aphids) that can destroy a seedling crop. Discuss the management responses: precise shallow sowing with good seed-soil contact; sowing into moisture on or soon after the break; choosing vigorous hybrids; insecticidal seed dressings and monitoring for establishment pests; and appropriate plant density (canola compensates well through branching, so target densities are modest, but a minimum plant stand is needed for reliable canopy closure and weed competition). Explain the strategic implications: because establishment is the make-or-break step and depends on an uncertain break, canola is concentrated in more reliable rainfall zones, and growers increasingly dry-sow canola to be ready to capitalise on the first rains. Reinforce that the same small seed that makes canola establishment risky also demands the precise seeding technology and moisture-conservation practices developed elsewhere in the unit.
    key_concepts:
      - "Shallow sowing (1-2 cm) into moisture, small seed reserve"
      - "Establishment pests: slugs, lucerne flea, RLEM, aphids"
      - "Target density around 15-30 plants/m2 given branching compensation"
      - "Dry-sowing to capture the uncertain break"
    wiki_query: "canola establishment plant density seedling pests seeding rate WA"

  - title: "Precision Establishment: Seed Size and Deep Sowing Innovations"
    description: >
      Deepen the discussion on establishment by detailing modern agronomic strategies and genetic innovations designed to mitigate early-season risk. Emphasize the critical importance of seed size: sowing larger, graded seeds (>1.8mm diameter) significantly enhances seedling vigour, early biomass, and survival rates, necessitating a shift from blanket kg/ha sowing rates to precise seeds/m² targets. Discuss the limitations of current varieties, which lack the hypocotyl length to safely emerge from deep sowing, leaving them vulnerable to hot, dry surface soils. Introduce the cutting-edge pre-breeding work developing long-hypocotyl canola lines, which will soon allow growers to safely sow deeper (3–5 cm) to chase stored subsoil moisture and avoid extreme surface temperatures during early autumn sowing — a major adaptation to increasingly variable seasonal breaks.
    key_concepts:
      - "Long Hypocotyl Genetics"
      - "Seed Vigour and Size Target"
      - "Deep Sowing Adaptation"
    wiki_query: "canola establishment seed size hypocotyl deep sowing"

  - title: "Adapting to Climate Extremes: Sowing Windows and Phenology"
    description: >
      Address the agronomic challenge of matching crop development to a changing climate, where the window between early-season false breaks, winter waterlogging, and late-season heat/frost is narrowing. Explain the strategy of aggressively moving sowing dates earlier (March/April) to maximize water-use efficiency and biomass before terminal spring drought. Discuss how this shift relies on matching variety phenology to the sowing time: using longer-season or winter-type varieties for early sowing so they delay flowering until the frost risk has passed, while reserving shorter-season spring types for later, conventional sowing windows. Detail the physiological risks of this approach, such as exposing early-emerging crops to severe heat stress at the soil surface, intense pest pressure, and the need for robust disease management due to heavier early canopies.
    key_concepts:
      - "Phenology and Sowing Windows"
      - "Early Sowing Systems"
      - "Frost and Heat Avoidance"
    wiki_query: "canola phenology early sowing frost heat stress"

  - title: "Nutrition: A Hungry Crop"
    description: >
      Explain canola's demanding and distinctive nutrition, which differs markedly from cereals. Canola is a heavy feeder on nitrogen — it requires more nitrogen per tonne than wheat to build its large canopy and fill oil-rich seed — so nitrogen is the dominant input decision, matched as always to yield potential and seasonal outlook, with the important quality nuance that excessive late nitrogen can raise protein at the expense of oil content (which is priced). Canola also has a high sulphur requirement, far greater than cereals, because sulphur is essential for the amino acids and oil synthesis; sulphur deficiency (common on sandy, leached WA soils) causes pale, cupped leaves and pale flowers and sharply reduces yield, so sulphur must be deliberately supplied. Explain the interactions with the rotation and season: canola grown after a legume or on a paddock with good mineralisation needs less fertiliser nitrogen, and nutrition strategy is adjusted in-season as the crop and season develop. Reinforce that getting nitrogen and sulphur right is central to both the yield and the oil content that determine canola's return, and that this makes canola nutrition a prime candidate for the responsive, model-informed management developed in the modelling lectures.
    key_concepts:
      - "High nitrogen demand builds canopy and fills oil-rich seed"
      - "Late nitrogen trades protein up against oil content"
      - "High sulphur requirement, deficiency common on sandy WA soils"
      - "Rotation history and mineralisation adjust the fertiliser strategy"
    wiki_query: "canola nitrogen sulphur nutrition deficiency WA sandy soils fertiliser"

  - title: "Precision Agriculture and Variable Rate Canopy Management"
    description: >
      Explore how precision agriculture is transforming the management of canola's high input requirements. Explain the use of spatial data — ranging from satellite NDVI imagery to drone mapping and yield data — to manage the inherent variability of paddocks. Detail how agronomists use variable rate technology (VRT) to spatially allocate expensive nitrogen and sulfur fertilizers to zones with the highest yield potential, maximizing return on investment while preventing lodging in high-biomass areas and avoiding wasted inputs in constrained zones. Discuss how remote sensing is increasingly used for early detection of patchy establishment, identifying disease hotspots (like early blackleg or sclerotinia outbreaks), and informing the targeted application of fungicides.
    key_concepts:
      - "Variable Rate Technology (VRT)"
      - "Remote Sensing and NDVI"
      - "Precision Nitrogen and Sulfur"
    wiki_query: "canola precision agriculture variable rate ndvi"

  - title: "Blackleg: The Defining Disease of Canola"
    description: >
      Introduce blackleg (caused by the fungus Leptosphaeria maculans) as canola's most important and damaging disease, and explain why its management is central to the crop's agronomy — with the detailed epidemiology developed in the diseases lecture. Describe the threat: blackleg infects the crop and can girdle the stem at the crown, killing or lodging plants and causing severe yield loss, and it survives on canola stubble between seasons, releasing spores that infect nearby new crops through a polycyclic cycle — windborne ascospores from stubble driving primary infection, and rain-splashed conidia driving secondary spread within a crop, a combination that amplifies severity well beyond simpler single-cycle disease models. Explain why blackleg is so severe in the Mediterranean, minimum-tillage WA environment: retained, infective stubble can persist for several years, one-year-old stubble is often the most prolific ascospore source, and windborne spores here travel up to around 15 km, far exceeding typical European dispersal — WA is in fact a global evolutionary hotspot for the pathogen, having originated roughly half of the known global disease races, which is why resistance genes break down and must be rotated. Set out the integrated management strategy that every canola grower must follow: growing varieties with strong genetic resistance and rotating the resistance genes/groups to prevent the pathogen overcoming them; separating this year's crop from last year's canola stubble by distance and time, generally within a rotation cycle of three years or more; strategic use of fungicides (seed dressings and foliar sprays timed to protect vulnerable stages, with decision-support tools that forecast spore release from temperature and rainfall to time sowing); and monitoring resistance breakdown — noting fungicide return is highest on intermediate-resistance varieties and negligible on highly resistant ones. Emphasise the key breeding and extension message from the learning outcomes: sources of resistance must be found and deployed, resistance groups rotated, and growers encouraged to use the full range of available cultivars rather than a narrow few, to preserve the durability of resistance — a genuine sustainability problem in canola production.
    key_concepts:
      - "Polycyclic infection: windborne ascospores plus rain-splashed conidia"
      - "WA as a global evolutionary hotspot for blackleg races"
      - "Resistance gene rotation and stubble separation by time/distance"
      - "Decision-support tools time sowing to spore-release forecasts"
    wiki_query: "blackleg Leptosphaeria maculans canola resistance stubble WA ascospores rotation"

  - title: "Other Diseases and Pests of Canola"
    description: >
      Round out the crop-protection picture with the other biotic threats canola faces through the season. Sclerotinia stem rot: a fungal disease favoured by wet, humid conditions during flowering, when infected petals drop onto stems and initiate lethal infections; managed by fungicides timed at flowering in high-risk seasons and by rotation. Other fungal issues include downy mildew and white leaf spot on seedlings. Pests span the whole season: establishment pests (slugs, redlegged earth mite, lucerne flea, cutworm) that threaten the vulnerable seedling; aphids, which colonise the crop and can transmit viruses and directly damage flowering plants in dry springs; and at the end, grazing pests and the risk of pod damage. Explain the management approach — monitoring and threshold-based intervention rather than routine spraying, insecticidal seed treatments for establishment protection, and integration with beneficial insects — and connect to the integrated pest and weed management philosophy of the unit. Emphasise that canola's higher susceptibility to establishment pests and to disease, compared with robust cereals, is part of what makes it a higher-risk, higher-management crop that rewards attentive, timely agronomy.
    key_concepts:
      - "Sclerotinia: petal infection during wet, humid flowering"
      - "Establishment pests: slugs, RLEM, lucerne flea, cutworm"
      - "Aphids as a mid-season and virus-transmission risk"
      - "Monitoring and threshold-based intervention, not routine spraying"
    wiki_query: "sclerotinia canola pests aphids monitoring threshold WA"

  - title: "Flowering, Pod Set and Windrowing versus Direct Heading"
    description: >
      Cover the reproductive and harvest phases, where canola's agronomy again differs sharply from cereals. Flowering and pod set: canola flowers over an extended period, offering some buffering against a single stress event, but the spring flowering and pod-fill window is exposed to heat, moisture stress, and frost, all of which reduce pod and seed number and oil content; the crop's long flowering also makes it attractive to pollinators though it is self-fertile. Harvest presents a distinctive problem: canola pods mature unevenly and, when ripe, are prone to shattering (splitting and dropping seed) and to pod loss in wind, threatening large harvest losses. Explain the two harvest methods that address this. Windrowing (swathing): cutting the crop at an intermediate maturity and laying it in windrows to cure and dry evenly, then threshing the windrows with a pickup front — reducing shattering loss and evening out maturity, long the standard WA practice. Direct heading: harvesting the standing crop directly at full maturity, cheaper and simpler and increasingly used with shatter-tolerant (pod-shatter-resistant) hybrid varieties and pod-sealant sprays that reduce shattering risk. Discuss the trade-offs — windrowing costs an extra operation and locks in timing but secures the crop, while direct heading saves cost but risks weather damage to a standing crop — and how variety (shatter tolerance) and season shape the choice.
    figure_id: "Fig-L07-Harvest"
    image_prompt: >
      Two-panel diagram of canola harvest methods. Left "Windrowing": a swather cutting the crop at intermediate maturity and laying it in windrows to cure, then a harvester with a pickup front threshing the windrow. Right "Direct heading": a harvester cutting a standing mature crop directly, with an inset showing shatter-resistant pods. Annotate trade-offs: windrowing reduces shatter loss but adds an operation; direct heading is cheaper but risks weather damage. UWA blue (#27348B) machinery, gold (#E2B600) crop and labels, academic diagram, --ar 16:9, --no text.
    key_concepts:
      - "Extended flowering buffers stress but exposes fill to heat/frost"
      - "Uneven maturity and shattering risk at harvest"
      - "Windrowing: cut early, cure, then thresh to cut shatter loss"
      - "Direct heading: cheaper, needs shatter-tolerant varieties"
    wiki_query: "canola flowering pod set windrowing direct heading shattering harvest"
    figure_source: "manual"

  - title: "Sustainability, Carbon Markets, and ISCC Certification"
    description: >
      Before drawing the crop together, examine the growing influence of sustainability metrics on canola marketing and farm management. Explain the International Sustainability and Carbon Certification (ISCC) scheme, which is essential for accessing premium prices in the European Union's biodiesel market. Discuss the stringent on-farm requirements: demonstrating zero land clearing of native vegetation, managing soil health, and rigorously tracking greenhouse gas (GHG) emissions. Emphasize that an agronomist's role now extends to optimizing nitrogen-use efficiency and fuel consumption to lower the crop's carbon footprint, turning sustainable agronomic practices — like legume rotations and variable rate application — into direct market premiums, aligning environmental stewardship with profitability. This certification layer sits alongside the quality specifications covered next: a further, sustainability-specific requirement WA canola increasingly has to meet to reach its highest-value EU outlet.
    key_concepts:
      - "ISCC Certification"
      - "Carbon Footprint"
      - "Biofuel Markets"
    wiki_query: "canola iscc certification sustainability carbon footprint"

  - title: "Canola Quality, Markets and the Whole-System Fit"
    description: >
      Conclude by connecting canola quality to its markets and its place in the WA farming system, synthesising the lecture. Quality parameters that determine price: oil content (the primary value driver, with premiums or penalties relative to a base level, so agronomy that lifts oil — balanced nutrition, avoiding heat and stress during fill — pays directly); low erucic acid and low glucosinolate (the defining canola specifications, genetically assured by variety); freedom from admixture, weather damage, and high moisture; and, increasingly, the sustainability certification just discussed. Markets: domestic crushing for oil and meal, and large exports to the EU (for food and biodiesel, with sustainability certification premiums) and to Asian crushers, giving canola strong and growing demand. System fit: reiterate canola's role as the pre-eminent break crop — a valuable oilseed that also cleans up grass weeds through its herbicide-tolerance systems, breaks cereal disease cycles, and lifts following-cereal yield — balanced against its higher risk (establishment, disease, stress sensitivity, harvest loss) that confines it largely to the medium and higher rainfall zones. Emphasise the unifying lesson: canola is the crop where breeding, herbicide-tolerance technology, disease management, and marketing are most tightly interwoven with agronomy, making it a rich example of the systems thinking the unit teaches — every decision, from variety and herbicide system to nutrition, disease strategy, and harvest method, must be integrated across the crop, the rotation, and the market.
    key_concepts:
      - "Oil content as the primary value driver"
      - "Erucic acid and glucosinolate specs genetically assured"
      - "EU and Asian export markets sustain strong demand"
      - "Canola as the pre-eminent break crop, weighed against its risk"
    wiki_query: "canola quality oil content markets break crop system WA"